<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Cuerpo del engranaje (círculo lleno, hace de fondo) -->
  <circle cx="32" cy="32" r="22" fill="#1a56db"/>

  <!-- 8 dientes distribuidos cada 45°, punta plana con esquinas suaves -->
  <g fill="#1a56db">
    <rect x="27" y="3" width="10" height="14" rx="2"/>
    <rect x="27" y="3" width="10" height="14" rx="2" transform="rotate(45 32 32)"/>
    <rect x="27" y="3" width="10" height="14" rx="2" transform="rotate(90 32 32)"/>
    <rect x="27" y="3" width="10" height="14" rx="2" transform="rotate(135 32 32)"/>
    <rect x="27" y="3" width="10" height="14" rx="2" transform="rotate(180 32 32)"/>
    <rect x="27" y="3" width="10" height="14" rx="2" transform="rotate(225 32 32)"/>
    <rect x="27" y="3" width="10" height="14" rx="2" transform="rotate(270 32 32)"/>
    <rect x="27" y="3" width="10" height="14" rx="2" transform="rotate(315 32 32)"/>
  </g>

  <!-- Símbolo $ blanco, grande y centrado -->
  <text x="32" y="44" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="32" font-weight="bold" fill="#ffffff">$</text>
</svg>
server.port=${PORT:8080}
spring.application.name=pricing-dinamico
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173}
# Autenticación (JWT + refresh token en cookie HttpOnly)
app.auth.jwt-secret=${JWT_SECRET:}
app.auth.access-token-ttl=${AUTH_ACCESS_TOKEN_TTL:10m}
app.auth.idle-timeout=${AUTH_IDLE_TIMEOUT:15m}
app.auth.session-max-duration=${AUTH_SESSION_MAX_DURATION:8h}
app.auth.max-failed-attempts=5
app.auth.lockout-duration=15m
app.auth.cookie.name=pricing_refresh
app.auth.cookie.secure=${AUTH_COOKIE_SECURE:true}
app.auth.cookie.same-site=${AUTH_COOKIE_SAME_SITE:Lax}
app.auth.cookie.path=/api/auth
app.auth.seed.admin-password=${ADMIN_PASSWORD:}
app.auth.seed.analista-password=${ANALISTA_PASSWORD:}
